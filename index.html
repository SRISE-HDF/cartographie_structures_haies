<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Structures d’accompagnement haies</title>
<script>(function() {
  // If window.HTMLWidgets is already defined, then use it; otherwise create a
  // new object. This allows preceding code to set options that affect the
  // initialization process (though none currently exist).
  window.HTMLWidgets = window.HTMLWidgets || {};

  // See if we're running in a viewer pane. If not, we're in a web browser.
  var viewerMode = window.HTMLWidgets.viewerMode =
      /\bviewer_pane=1\b/.test(window.location);

  // See if we're running in Shiny mode. If not, it's a static document.
  // Note that static widgets can appear in both Shiny and static modes, but
  // obviously, Shiny widgets can only appear in Shiny apps/documents.
  var shinyMode = window.HTMLWidgets.shinyMode =
      typeof(window.Shiny) !== "undefined" && !!window.Shiny.outputBindings;

  // We can't count on jQuery being available, so we implement our own
  // version if necessary.
  function querySelectorAll(scope, selector) {
    if (typeof(jQuery) !== "undefined" && scope instanceof jQuery) {
      return scope.find(selector);
    }
    if (scope.querySelectorAll) {
      return scope.querySelectorAll(selector);
    }
  }

  function asArray(value) {
    if (value === null)
      return [];
    if ($.isArray(value))
      return value;
    return [value];
  }

  // Implement jQuery's extend
  function extend(target /*, ... */) {
    if (arguments.length == 1) {
      return target;
    }
    for (var i = 1; i < arguments.length; i++) {
      var source = arguments[i];
      for (var prop in source) {
        if (source.hasOwnProperty(prop)) {
          target[prop] = source[prop];
        }
      }
    }
    return target;
  }

  // IE8 doesn't support Array.forEach.
  function forEach(values, callback, thisArg) {
    if (values.forEach) {
      values.forEach(callback, thisArg);
    } else {
      for (var i = 0; i < values.length; i++) {
        callback.call(thisArg, values[i], i, values);
      }
    }
  }

  // Replaces the specified method with the return value of funcSource.
  //
  // Note that funcSource should not BE the new method, it should be a function
  // that RETURNS the new method. funcSource receives a single argument that is
  // the overridden method, it can be called from the new method. The overridden
  // method can be called like a regular function, it has the target permanently
  // bound to it so "this" will work correctly.
  function overrideMethod(target, methodName, funcSource) {
    var superFunc = target[methodName] || function() {};
    var superFuncBound = function() {
      return superFunc.apply(target, arguments);
    };
    target[methodName] = funcSource(superFuncBound);
  }

  // Add a method to delegator that, when invoked, calls
  // delegatee.methodName. If there is no such method on
  // the delegatee, but there was one on delegator before
  // delegateMethod was called, then the original version
  // is invoked instead.
  // For example:
  //
  // var a = {
  //   method1: function() { console.log('a1'); }
  //   method2: function() { console.log('a2'); }
  // };
  // var b = {
  //   method1: function() { console.log('b1'); }
  // };
  // delegateMethod(a, b, "method1");
  // delegateMethod(a, b, "method2");
  // a.method1();
  // a.method2();
  //
  // The output would be "b1", "a2".
  function delegateMethod(delegator, delegatee, methodName) {
    var inherited = delegator[methodName];
    delegator[methodName] = function() {
      var target = delegatee;
      var method = delegatee[methodName];

      // The method doesn't exist on the delegatee. Instead,
      // call the method on the delegator, if it exists.
      if (!method) {
        target = delegator;
        method = inherited;
      }

      if (method) {
        return method.apply(target, arguments);
      }
    };
  }

  // Implement a vague facsimilie of jQuery's data method
  function elementData(el, name, value) {
    if (arguments.length == 2) {
      return el["htmlwidget_data_" + name];
    } else if (arguments.length == 3) {
      el["htmlwidget_data_" + name] = value;
      return el;
    } else {
      throw new Error("Wrong number of arguments for elementData: " +
        arguments.length);
    }
  }

  // http://stackoverflow.com/questions/3446170/escape-string-for-use-in-javascript-regex
  function escapeRegExp(str) {
    return str.replace(/[\-\[\]\/\{\}\(\)\*\+\?\.\\\^\$\|]/g, "\\$&");
  }

  function hasClass(el, className) {
    var re = new RegExp("\\b" + escapeRegExp(className) + "\\b");
    return re.test(el.className);
  }

  // elements - array (or array-like object) of HTML elements
  // className - class name to test for
  // include - if true, only return elements with given className;
  //   if false, only return elements *without* given className
  function filterByClass(elements, className, include) {
    var results = [];
    for (var i = 0; i < elements.length; i++) {
      if (hasClass(elements[i], className) == include)
        results.push(elements[i]);
    }
    return results;
  }

  function on(obj, eventName, func) {
    if (obj.addEventListener) {
      obj.addEventListener(eventName, func, false);
    } else if (obj.attachEvent) {
      obj.attachEvent(eventName, func);
    }
  }

  function off(obj, eventName, func) {
    if (obj.removeEventListener)
      obj.removeEventListener(eventName, func, false);
    else if (obj.detachEvent) {
      obj.detachEvent(eventName, func);
    }
  }

  // Translate array of values to top/right/bottom/left, as usual with
  // the "padding" CSS property
  // https://developer.mozilla.org/en-US/docs/Web/CSS/padding
  function unpackPadding(value) {
    if (typeof(value) === "number")
      value = [value];
    if (value.length === 1) {
      return {top: value[0], right: value[0], bottom: value[0], left: value[0]};
    }
    if (value.length === 2) {
      return {top: value[0], right: value[1], bottom: value[0], left: value[1]};
    }
    if (value.length === 3) {
      return {top: value[0], right: value[1], bottom: value[2], left: value[1]};
    }
    if (value.length === 4) {
      return {top: value[0], right: value[1], bottom: value[2], left: value[3]};
    }
  }

  // Convert an unpacked padding object to a CSS value
  function paddingToCss(paddingObj) {
    return paddingObj.top + "px " + paddingObj.right + "px " + paddingObj.bottom + "px " + paddingObj.left + "px";
  }

  // Makes a number suitable for CSS
  function px(x) {
    if (typeof(x) === "number")
      return x + "px";
    else
      return x;
  }

  // Retrieves runtime widget sizing information for an element.
  // The return value is either null, or an object with fill, padding,
  // defaultWidth, defaultHeight fields.
  function sizingPolicy(el) {
    var sizingEl = document.querySelector("script[data-for='" + el.id + "'][type='application/htmlwidget-sizing']");
    if (!sizingEl)
      return null;
    var sp = JSON.parse(sizingEl.textContent || sizingEl.text || "{}");
    if (viewerMode) {
      return sp.viewer;
    } else {
      return sp.browser;
    }
  }

  // @param tasks Array of strings (or falsy value, in which case no-op).
  //   Each element must be a valid JavaScript expression that yields a
  //   function. Or, can be an array of objects with "code" and "data"
  //   properties; in this case, the "code" property should be a string
  //   of JS that's an expr that yields a function, and "data" should be
  //   an object that will be added as an additional argument when that
  //   function is called.
  // @param target The object that will be "this" for each function
  //   execution.
  // @param args Array of arguments to be passed to the functions. (The
  //   same arguments will be passed to all functions.)
  function evalAndRun(tasks, target, args) {
    if (tasks) {
      forEach(tasks, function(task) {
        var theseArgs = args;
        if (typeof(task) === "object") {
          theseArgs = theseArgs.concat([task.data]);
          task = task.code;
        }
        var taskFunc = tryEval(task);
        if (typeof(taskFunc) !== "function") {
          throw new Error("Task must be a function! Source:\n" + task);
        }
        taskFunc.apply(target, theseArgs);
      });
    }
  }

  // Attempt eval() both with and without enclosing in parentheses.
  // Note that enclosing coerces a function declaration into
  // an expression that eval() can parse
  // (otherwise, a SyntaxError is thrown)
  function tryEval(code) {
    var result = null;
    try {
      result = eval("(" + code + ")");
    } catch(error) {
      if (!(error instanceof SyntaxError)) {
        throw error;
      }
      try {
        result = eval(code);
      } catch(e) {
        if (e instanceof SyntaxError) {
          throw error;
        } else {
          throw e;
        }
      }
    }
    return result;
  }

  function initSizing(el) {
    var sizing = sizingPolicy(el);
    if (!sizing)
      return;

    var cel = document.getElementById("htmlwidget_container");
    if (!cel)
      return;

    if (typeof(sizing.padding) !== "undefined") {
      document.body.style.margin = "0";
      document.body.style.padding = paddingToCss(unpackPadding(sizing.padding));
    }

    if (sizing.fill) {
      document.body.style.overflow = "hidden";
      document.body.style.width = "100%";
      document.body.style.height = "100%";
      document.documentElement.style.width = "100%";
      document.documentElement.style.height = "100%";
      cel.style.position = "absolute";
      var pad = unpackPadding(sizing.padding);
      cel.style.top = pad.top + "px";
      cel.style.right = pad.right + "px";
      cel.style.bottom = pad.bottom + "px";
      cel.style.left = pad.left + "px";
      el.style.width = "100%";
      el.style.height = "100%";

      return {
        getWidth: function() { return cel.getBoundingClientRect().width; },
        getHeight: function() { return cel.getBoundingClientRect().height; }
      };

    } else {
      el.style.width = px(sizing.width);
      el.style.height = px(sizing.height);

      return {
        getWidth: function() { return cel.getBoundingClientRect().width; },
        getHeight: function() { return cel.getBoundingClientRect().height; }
      };
    }
  }

  // Default implementations for methods
  var defaults = {
    find: function(scope) {
      return querySelectorAll(scope, "." + this.name);
    },
    renderError: function(el, err) {
      var $el = $(el);

      this.clearError(el);

      // Add all these error classes, as Shiny does
      var errClass = "shiny-output-error";
      if (err.type !== null) {
        // use the classes of the error condition as CSS class names
        errClass = errClass + " " + $.map(asArray(err.type), function(type) {
          return errClass + "-" + type;
        }).join(" ");
      }
      errClass = errClass + " htmlwidgets-error";

      // Is el inline or block? If inline or inline-block, just display:none it
      // and add an inline error.
      var display = $el.css("display");
      $el.data("restore-display-mode", display);

      if (display === "inline" || display === "inline-block") {
        $el.hide();
        if (err.message !== "") {
          var errorSpan = $("<span>").addClass(errClass);
          errorSpan.text(err.message);
          $el.after(errorSpan);
        }
      } else if (display === "block") {
        // If block, add an error just after the el, set visibility:none on the
        // el, and position the error to be on top of the el.
        // Mark it with a unique ID and CSS class so we can remove it later.
        $el.css("visibility", "hidden");
        if (err.message !== "") {
          var errorDiv = $("<div>").addClass(errClass).css("position", "absolute")
            .css("top", el.offsetTop)
            .css("left", el.offsetLeft)
            // setting width can push out the page size, forcing otherwise
            // unnecessary scrollbars to appear and making it impossible for
            // the element to shrink; so use max-width instead
            .css("maxWidth", el.offsetWidth)
            .css("height", el.offsetHeight);
          errorDiv.text(err.message);
          $el.after(errorDiv);

          // Really dumb way to keep the size/position of the error in sync with
          // the parent element as the window is resized or whatever.
          var intId = setInterval(function() {
            if (!errorDiv[0].parentElement) {
              clearInterval(intId);
              return;
            }
            errorDiv
              .css("top", el.offsetTop)
              .css("left", el.offsetLeft)
              .css("maxWidth", el.offsetWidth)
              .css("height", el.offsetHeight);
          }, 500);
        }
      }
    },
    clearError: function(el) {
      var $el = $(el);
      var display = $el.data("restore-display-mode");
      $el.data("restore-display-mode", null);

      if (display === "inline" || display === "inline-block") {
        if (display)
          $el.css("display", display);
        $(el.nextSibling).filter(".htmlwidgets-error").remove();
      } else if (display === "block"){
        $el.css("visibility", "inherit");
        $(el.nextSibling).filter(".htmlwidgets-error").remove();
      }
    },
    sizing: {}
  };

  // Called by widget bindings to register a new type of widget. The definition
  // object can contain the following properties:
  // - name (required) - A string indicating the binding name, which will be
  //   used by default as the CSS classname to look for.
  // - initialize (optional) - A function(el) that will be called once per
  //   widget element; if a value is returned, it will be passed as the third
  //   value to renderValue.
  // - renderValue (required) - A function(el, data, initValue) that will be
  //   called with data. Static contexts will cause this to be called once per
  //   element; Shiny apps will cause this to be called multiple times per
  //   element, as the data changes.
  window.HTMLWidgets.widget = function(definition) {
    if (!definition.name) {
      throw new Error("Widget must have a name");
    }
    if (!definition.type) {
      throw new Error("Widget must have a type");
    }
    // Currently we only support output widgets
    if (definition.type !== "output") {
      throw new Error("Unrecognized widget type '" + definition.type + "'");
    }
    // TODO: Verify that .name is a valid CSS classname

    // Support new-style instance-bound definitions. Old-style class-bound
    // definitions have one widget "object" per widget per type/class of
    // widget; the renderValue and resize methods on such widget objects
    // take el and instance arguments, because the widget object can't
    // store them. New-style instance-bound definitions have one widget
    // object per widget instance; the definition that's passed in doesn't
    // provide renderValue or resize methods at all, just the single method
    //   factory(el, width, height)
    // which returns an object that has renderValue(x) and resize(w, h).
    // This enables a far more natural programming style for the widget
    // author, who can store per-instance state using either OO-style
    // instance fields or functional-style closure variables (I guess this
    // is in contrast to what can only be called C-style pseudo-OO which is
    // what we required before).
    if (definition.factory) {
      definition = createLegacyDefinitionAdapter(definition);
    }

    if (!definition.renderValue) {
      throw new Error("Widget must have a renderValue function");
    }

    // For static rendering (non-Shiny), use a simple widget registration
    // scheme. We also use this scheme for Shiny apps/documents that also
    // contain static widgets.
    window.HTMLWidgets.widgets = window.HTMLWidgets.widgets || [];
    // Merge defaults into the definition; don't mutate the original definition.
    var staticBinding = extend({}, defaults, definition);
    overrideMethod(staticBinding, "find", function(superfunc) {
      return function(scope) {
        var results = superfunc(scope);
        // Filter out Shiny outputs, we only want the static kind
        return filterByClass(results, "html-widget-output", false);
      };
    });
    window.HTMLWidgets.widgets.push(staticBinding);

    if (shinyMode) {
      // Shiny is running. Register the definition with an output binding.
      // The definition itself will not be the output binding, instead
      // we will make an output binding object that delegates to the
      // definition. This is because we foolishly used the same method
      // name (renderValue) for htmlwidgets definition and Shiny bindings
      // but they actually have quite different semantics (the Shiny
      // bindings receive data that includes lots of metadata that it
      // strips off before calling htmlwidgets renderValue). We can't
      // just ignore the difference because in some widgets it's helpful
      // to call this.renderValue() from inside of resize(), and if
      // we're not delegating, then that call will go to the Shiny
      // version instead of the htmlwidgets version.

      // Merge defaults with definition, without mutating either.
      var bindingDef = extend({}, defaults, definition);

      // This object will be our actual Shiny binding.
      var shinyBinding = new Shiny.OutputBinding();

      // With a few exceptions, we'll want to simply use the bindingDef's
      // version of methods if they are available, otherwise fall back to
      // Shiny's defaults. NOTE: If Shiny's output bindings gain additional
      // methods in the future, and we want them to be overrideable by
      // HTMLWidget binding definitions, then we'll need to add them to this
      // list.
      delegateMethod(shinyBinding, bindingDef, "getId");
      delegateMethod(shinyBinding, bindingDef, "onValueChange");
      delegateMethod(shinyBinding, bindingDef, "onValueError");
      delegateMethod(shinyBinding, bindingDef, "renderError");
      delegateMethod(shinyBinding, bindingDef, "clearError");
      delegateMethod(shinyBinding, bindingDef, "showProgress");

      // The find, renderValue, and resize are handled differently, because we
      // want to actually decorate the behavior of the bindingDef methods.

      shinyBinding.find = function(scope) {
        var results = bindingDef.find(scope);

        // Only return elements that are Shiny outputs, not static ones
        var dynamicResults = results.filter(".html-widget-output");

        // It's possible that whatever caused Shiny to think there might be
        // new dynamic outputs, also caused there to be new static outputs.
        // Since there might be lots of different htmlwidgets bindings, we
        // schedule execution for later--no need to staticRender multiple
        // times.
        if (results.length !== dynamicResults.length)
          scheduleStaticRender();

        return dynamicResults;
      };

      // Wrap renderValue to handle initialization, which unfortunately isn't
      // supported natively by Shiny at the time of this writing.

      shinyBinding.renderValue = function(el, data) {
        Shiny.renderDependencies(data.deps);
        // Resolve strings marked as javascript literals to objects
        if (!(data.evals instanceof Array)) data.evals = [data.evals];
        for (var i = 0; data.evals && i < data.evals.length; i++) {
          window.HTMLWidgets.evaluateStringMember(data.x, data.evals[i]);
        }
        if (!bindingDef.renderOnNullValue) {
          if (data.x === null) {
            el.style.visibility = "hidden";
            return;
          } else {
            el.style.visibility = "inherit";
          }
        }
        if (!elementData(el, "initialized")) {
          initSizing(el);

          elementData(el, "initialized", true);
          if (bindingDef.initialize) {
            var rect = el.getBoundingClientRect();
            var result = bindingDef.initialize(el, rect.width, rect.height);
            elementData(el, "init_result", result);
          }
        }
        bindingDef.renderValue(el, data.x, elementData(el, "init_result"));
        evalAndRun(data.jsHooks.render, elementData(el, "init_result"), [el, data.x]);
      };

      // Only override resize if bindingDef implements it
      if (bindingDef.resize) {
        shinyBinding.resize = function(el, width, height) {
          // Shiny can call resize before initialize/renderValue have been
          // called, which doesn't make sense for widgets.
          if (elementData(el, "initialized")) {
            bindingDef.resize(el, width, height, elementData(el, "init_result"));
          }
        };
      }

      Shiny.outputBindings.register(shinyBinding, bindingDef.name);
    }
  };

  var scheduleStaticRenderTimerId = null;
  function scheduleStaticRender() {
    if (!scheduleStaticRenderTimerId) {
      scheduleStaticRenderTimerId = setTimeout(function() {
        scheduleStaticRenderTimerId = null;
        window.HTMLWidgets.staticRender();
      }, 1);
    }
  }

  // Render static widgets after the document finishes loading
  // Statically render all elements that are of this widget's class
  window.HTMLWidgets.staticRender = function() {
    var bindings = window.HTMLWidgets.widgets || [];
    forEach(bindings, function(binding) {
      var matches = binding.find(document.documentElement);
      forEach(matches, function(el) {
        var sizeObj = initSizing(el, binding);

        var getSize = function(el) {
          if (sizeObj) {
            return {w: sizeObj.getWidth(), h: sizeObj.getHeight()}
          } else {
            var rect = el.getBoundingClientRect();
            return {w: rect.width, h: rect.height}
          }
        };

        if (hasClass(el, "html-widget-static-bound"))
          return;
        el.className = el.className + " html-widget-static-bound";

        var initResult;
        if (binding.initialize) {
          var size = getSize(el);
          initResult = binding.initialize(el, size.w, size.h);
          elementData(el, "init_result", initResult);
        }

        if (binding.resize) {
          var lastSize = getSize(el);
          var resizeHandler = function(e) {
            var size = getSize(el);
            if (size.w === 0 && size.h === 0)
              return;
            if (size.w === lastSize.w && size.h === lastSize.h)
              return;
            lastSize = size;
            binding.resize(el, size.w, size.h, initResult);
          };

          on(window, "resize", resizeHandler);

          // This is needed for cases where we're running in a Shiny
          // app, but the widget itself is not a Shiny output, but
          // rather a simple static widget. One example of this is
          // an rmarkdown document that has runtime:shiny and widget
          // that isn't in a render function. Shiny only knows to
          // call resize handlers for Shiny outputs, not for static
          // widgets, so we do it ourselves.
          if (window.jQuery) {
            window.jQuery(document).on(
              "shown.htmlwidgets shown.bs.tab.htmlwidgets shown.bs.collapse.htmlwidgets",
              resizeHandler
            );
            window.jQuery(document).on(
              "hidden.htmlwidgets hidden.bs.tab.htmlwidgets hidden.bs.collapse.htmlwidgets",
              resizeHandler
            );
          }

          // This is needed for the specific case of ioslides, which
          // flips slides between display:none and display:block.
          // Ideally we would not have to have ioslide-specific code
          // here, but rather have ioslides raise a generic event,
          // but the rmarkdown package just went to CRAN so the
          // window to getting that fixed may be long.
          if (window.addEventListener) {
            // It's OK to limit this to window.addEventListener
            // browsers because ioslides itself only supports
            // such browsers.
            on(document, "slideenter", resizeHandler);
            on(document, "slideleave", resizeHandler);
          }
        }

        var scriptData = document.querySelector("script[data-for='" + el.id + "'][type='application/json']");
        if (scriptData) {
          var data = JSON.parse(scriptData.textContent || scriptData.text);
          // Resolve strings marked as javascript literals to objects
          if (!(data.evals instanceof Array)) data.evals = [data.evals];
          for (var k = 0; data.evals && k < data.evals.length; k++) {
            window.HTMLWidgets.evaluateStringMember(data.x, data.evals[k]);
          }
          binding.renderValue(el, data.x, initResult);
          evalAndRun(data.jsHooks.render, initResult, [el, data.x]);
        }
      });
    });

    invokePostRenderHandlers();
  }


  function has_jQuery3() {
    if (!window.jQuery) {
      return false;
    }
    var $version = window.jQuery.fn.jquery;
    var $major_version = parseInt($version.split(".")[0]);
    return $major_version >= 3;
  }

  /*
  / Shiny 1.4 bumped jQuery from 1.x to 3.x which means jQuery's
  / on-ready handler (i.e., $(fn)) is now asyncronous (i.e., it now
  / really means $(setTimeout(fn)).
  / https://jquery.com/upgrade-guide/3.0/#breaking-change-document-ready-handlers-are-now-asynchronous
  /
  / Since Shiny uses $() to schedule initShiny, shiny>=1.4 calls initShiny
  / one tick later than it did before, which means staticRender() is
  / called renderValue() earlier than (advanced) widget authors might be expecting.
  / https://github.com/rstudio/shiny/issues/2630
  /
  / For a concrete example, leaflet has some methods (e.g., updateBounds)
  / which reference Shiny methods registered in initShiny (e.g., setInputValue).
  / Since leaflet is privy to this life-cycle, it knows to use setTimeout() to
  / delay execution of those methods (until Shiny methods are ready)
  / https://github.com/rstudio/leaflet/blob/18ec981/javascript/src/index.js#L266-L268
  /
  / Ideally widget authors wouldn't need to use this setTimeout() hack that
  / leaflet uses to call Shiny methods on a staticRender(). In the long run,
  / the logic initShiny should be broken up so that method registration happens
  / right away, but binding happens later.
  */
  function maybeStaticRenderLater() {
    if (shinyMode && has_jQuery3()) {
      window.jQuery(window.HTMLWidgets.staticRender);
    } else {
      window.HTMLWidgets.staticRender();
    }
  }

  if (document.addEventListener) {
    document.addEventListener("DOMContentLoaded", function() {
      document.removeEventListener("DOMContentLoaded", arguments.callee, false);
      maybeStaticRenderLater();
    }, false);
  } else if (document.attachEvent) {
    document.attachEvent("onreadystatechange", function() {
      if (document.readyState === "complete") {
        document.detachEvent("onreadystatechange", arguments.callee);
        maybeStaticRenderLater();
      }
    });
  }

<style type="text/css">
img.leaflet-tile {
padding: 0;
margin: 0;
border-radius: 0;
border: none;
}
.leaflet .info {
padding: 6px 8px;
font: 14px/16px Arial, Helvetica, sans-serif;
background: white;
background: rgba(255,255,255,0.8);
box-shadow: 0 0 15px rgba(0,0,0,0.2);
border-radius: 5px;
}
.leaflet .legend {
line-height: 18px;
color: #555;
}
.leaflet .legend svg text {
fill: #555;
}
.leaflet .legend svg line {
stroke: #555;
}
.leaflet .legend i {
width: 18px;
height: 18px;
margin-right: 4px;
opacity: 0.7;
display: inline-block;
vertical-align: top;

zoom: 1;
*display: inline;

.leaflet-container{font-family:'Marianne',Arial,sans-serif;background:#eef3ef;}
.leaflet-right{right:calc(360px + 28px);}
.fond-doux{filter:saturate(.55) brightness(1.05) contrast(.95);}
.fond-gris{filter:grayscale(1) brightness(1.05) contrast(.9);}
.ico{width:18px;height:18px;flex:none;fill:currentColor;}
[hidden]{display:none !important;}

.leaflet-bar,.leaflet-control-layers{border:none !important;border-radius:12px !important;
box-shadow:0 4px 14px rgba(15,61,42,.18) !important;overflow:hidden;}
.leaflet-bar a{width:36px !important;height:36px !important;line-height:36px !important;color:#0f3d2a !important;}
.leaflet-control-layers-toggle{width:40px !important;height:40px !important;}
.leaflet-control-scale-line{border-radius:6px;border-color:#0f3d2a;background:rgba(255,255,255,.85);}

.volet{position:absolute;top:14px;right:14px;bottom:14px;width:360px;max-width:calc(100% - 28px);z-index:1000;
background:#fbfdfb;border-radius:18px;box-shadow:0 12px 40px rgba(15,61,42,.22),0 2px 6px rgba(15,61,42,.08);
display:flex;flex-direction:column;overflow:hidden;font-family:'Marianne',Arial,sans-serif;
font-size:14px;line-height:1.5;color:#1e2a24;cursor:auto;}
.volet-entete{padding:12px 16px 10px 16px;background:#fff;}
.volet-haut{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.bloc-marque{font-weight:700;font-size:11px;line-height:1.15;letter-spacing:.03em;text-transform:uppercase;
padding-top:4px;border-top:3px solid #000091;color:#161616;}
.btn-ico{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:none;
border-radius:10px;background:#eef5f0;color:#0f3d2a;cursor:pointer;padding:0;transition:background .15s;}
.btn-ico:hover{background:#dcebe1;}
.btn-ico:disabled{opacity:.35;cursor:default;}

.hero{background:linear-gradient(135deg,#0f3d2a 0%,#1f7a4d 100%);color:#fff;padding:16px 16px 14px 16px;
position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;
background:rgba(255,255,255,.07);pointer-events:none;}
.hero-titre{font-size:19px;font-weight:700;line-height:1.25;position:relative;}
.hero-sous{font-size:13px;opacity:.85;margin-top:2px;position:relative;}
.outils{display:flex;flex-direction:column;gap:8px;margin-top:12px;position:relative;z-index:1;}
.recherche{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 10px;
box-shadow:0 2px 8px rgba(0,0,0,.12);}
.recherche .ico{color:#1f7a4d;}
.recherche input{flex:1;min-width:0;border:none;background:transparent;padding:10px 0;outline:none;
font-family:inherit;font-size:14px;color:#1e2a24;}
.recherche input::-webkit-search-cancel-button{display:none;}
.recherche:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.12);}
.effacer{border:none;background:none;cursor:pointer;color:#7a8a80;padding:2px;display:flex;}
.btn-filtres{display:flex;align-items:center;gap:8px;width:100%;border:1px solid rgba(255,255,255,.35);
border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-family:inherit;font-size:14px;
font-weight:500;padding:8px 12px;cursor:pointer;text-align:left;transition:background .15s;}
.btn-filtres:hover{background:rgba(255,255,255,.22);}
.btn-filtres .lib{flex:1;}
.btn-filtres .ico:last-child{transition:transform .2s;}
.btn-filtres[aria-expanded=true] .ico:last-child{transform:rotate(180deg);}
.badge{background:#fff;color:#0f3d2a;border-radius:10px;font-size:12px;font-weight:700;padding:0 7px;line-height:18px;}
.filtres{max-height:36vh;overflow-y:auto;background:#fff;color:#1e2a24;border-radius:12px;padding:4px 12px 12px 12px;}
.f-theme{display:flex;gap:6px;align-items:center;font-weight:700;font-size:13px;color:var(--c,#1f7a4d);margin:10px 0 6px 0;}
.f-theme .ico{width:16px;height:16px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{border:1px solid #d5e3da;border-radius:999px;background:#fff;color:#2c3e33;font-family:inherit;
font-size:12.5px;line-height:1.3;padding:4px 11px;cursor:pointer;text-align:left;transition:all .15s;}
.tag:hover{border-color:#1f7a4d;background:#f1f8f3;}
.tag[aria-pressed=true]{background:#1f7a4d;border-color:#1f7a4d;color:#fff;}
.tag[aria-pressed=true]::before{content:'\2713\00a0';}
.aide{font-size:12px;color:#6b7a70;margin:10px 0 0 0;}
.resume{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:#fff;}
.resume .lien{color:#fff;}
.lien{border:none;background:none;color:#1f7a4d;text-decoration:underline;text-underline-offset:2px;cursor:pointer;
font-family:inherit;font-size:13px;padding:0;display:inline-flex;align-items:center;gap:4px;}
.lien .ico{width:16px;height:16px;}

.volet-nav{display:none;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;
background:#f1f8f3;border-bottom:1px solid #e3eee6;font-size:13px;color:#2c3e33;text-align:center;}
.volet-nav.visible{display:flex;}

.volet-corps{flex:1;overflow-y:auto;padding:18px 16px 28px 16px;animation:apparition .25s ease;}
@keyframes apparition{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.volet-corps h2{font-size:20px;font-weight:700;line-height:1.25;margin:0 0 10px 0;color:#0f3d2a;}
.volet-corps h4{font-size:14px;font-weight:700;margin:16px 0 6px 0;}
.volet-corps p{margin:0 0 8px 0;}
.volet-corps a{color:#1f7a4d;font-weight:500;text-underline-offset:2px;word-break:break-word;}
.ligne{display:flex;gap:10px;align-items:flex-start;margin:6px 0;}
.ligne .ico{color:#1f7a4d;margin-top:2px;}
.approx{font-size:12px;color:#8a6a1f;background:#fff6e0;border-radius:6px;padding:2px 8px;
display:inline-block;margin:2px 0 4px 28px;}
.carte{background:#fff;border:1px solid #e3eee6;border-radius:14px;padding:12px 14px;margin:14px 0;
box-shadow:0 1px 3px rgba(15,61,42,.05);}
.titre-section{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6b7a70;margin-bottom:4px;}
.hors-carte{margin:18px 0 8px 0;}
.theme-carte{border-left:4px solid var(--c);background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;
box-shadow:0 1px 3px rgba(15,61,42,.08);}
.theme{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--c);margin-bottom:8px;}
.theme .ico{width:20px;height:20px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:12.5px;line-height:1.3;padding:4px 10px;border-radius:999px;background:#eef3ef;color:#1e2a24;
background:color-mix(in srgb,var(--c) 13%,white);color:color-mix(in srgb,var(--c) 70%,black);}
.chip.retenu{background:var(--c);color:#fff;font-weight:700;}
.retour{margin-bottom:12px;}
.volet-corps h2.titre-liste{font-size:17px;}
.resultats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.resultats button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:1px solid #e3eee6;
border-radius:12px;background:#fff;padding:10px 12px;cursor:pointer;font-family:inherit;transition:all .15s;}
.resultats button:hover{border-color:#1f7a4d;box-shadow:0 4px 12px rgba(15,61,42,.1);transform:translateY(-1px);}
.r-nom{font-weight:700;font-size:14px;color:#0f3d2a;}
.r-adr{font-size:12.5px;color:#6b7a70;}
.communes{margin-bottom:10px;}
.c-titre{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6b7a70;margin:2px 0 6px 0;}
.c-btn{display:flex;align-items:center;gap:8px;width:100%;border:1px dashed #b9d3c2;border-radius:12px;
background:#f6fbf7;color:#1e2a24;font-family:inherit;font-size:14px;padding:8px 10px;margin-bottom:6px;
cursor:pointer;text-align:left;}
.c-btn:hover{background:#eaf5ee;}
.c-btn .ico{color:#1f7a4d;}

.mode-emploi{background:#e3f2ea;color:#24533f;border-radius:14px;padding:14px 16px;margin:16px 0;line-height:1.55;}
.volet-corps .mode-emploi h4{color:#1d4a37;font-size:14px;font-weight:700;margin:16px 0 8px 0;}
.volet-corps .mode-emploi h4:first-child{margin-top:0;}
.mode-emploi .item{margin:3px 0;}
.mode-emploi p{margin:0;}
.mode-emploi b{color:#163d2d;}
.emo{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:15px;margin-right:3px;}
.encart{margin:16px 0 10px 0;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid #e3eee6;
border-left:4px solid #1f7a4d;}
.source{font-size:12px;color:#6b7a70;margin-top:14px;}

.pt{width:30px;height:30px;border-radius:50%;background:#1f7a4d;border:3px solid #fff;box-sizing:border-box;
box-shadow:0 3px 10px rgba(15,61,42,.35);display:flex;align-items:center;justify-content:center;
color:#fff;transition:transform .15s;}
.pt .ico{width:14px;height:14px;}
.pt span{font-weight:700;font-size:13px;font-family:'Marianne',Arial,sans-serif;}
.leaflet-marker-icon:hover .pt{transform:scale(1.12);}
.pt.sel{width:38px;height:38px;background:#0f3d2a;animation:pulse 1.8s infinite;}
.pt.sel .ico{width:18px;height:18px;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,169,0,.65),0 4px 12px rgba(15,61,42,.4);}
70%{box-shadow:0 0 0 14px rgba(242,169,0,0),0 4px 12px rgba(15,61,42,.4);}
100%{box-shadow:0 0 0 0 rgba(242,169,0,0),0 4px 12px rgba(15,61,42,.4);}}
.grappe{border-radius:50%;background:radial-gradient(circle at 30% 30%,#1f7a4d,#0f3d2a);color:#fff;font-weight:700;
font-size:14px;font-family:'Marianne',Arial,sans-serif;display:flex;align-items:center;justify-content:center;
border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,122,77,.22),0 4px 12px rgba(15,61,42,.3);}
.leaflet-tooltip{font-family:'Marianne',Arial,sans-serif;font-size:13px;border:none;border-radius:8px;
box-shadow:0 4px 14px rgba(15,61,42,.2);padding:5px 10px;}

usterGroup) {\n    couche = L.markerClusterGroup({\n      maxClusterRadius: d.cluster.rayon,\n      disableClusteringAtZoom: d.cluster.zoom_max,\n      showCoverageOnHover: false,\n      spiderfyOnMaxZoom: true,\n      iconCreateFunction: function(cl) {\n        var total = 0;   // nombre total de structures (un point peut en contenir plusieurs)\n        cl.getAllChildMarkers().forEach(function(mk) { total += mk.options.nbStructures || 1; });\n        var taille = total < 10 ? 36 : (total < 30 ? 44 : 52);\n        return L.divIcon({\n          className: '',\n          html: '<div class=\"grappe\" style=\"width:' + taille + 'px;height:' + taille + 'px\">' + total + '<\/div>',\n          iconSize: [taille, taille]\n        });\n      }\n    });\n  } else {\n    couche = L.featureGroup();\n  }\n  couche.addTo(map);\n\n  var marqueurs = [];   // par lieu : {marker, ids} ou null si masqué\n  var courant = null;   // {k, pos}\n\n  function construire() {\n    couche.clearLayers();\n    marqueurs = [];\n    d.lieux.forEach(function(lieu, k) {\n      var ids = [].concat(lieu.fiches).filter(function(i) { return correspond(d.fiches[i]); });\n      if (!ids.length) { marqueurs[k] = null; return; }\n      var m = L.marker([lieu.lat, lieu.lon], {icon: icone(ids.length, false), nbStructures: ids.length});\n      var noms = ids.map(function(i) { return d.fiches[i].nom; });\n      m.bindTooltip(noms.length > 1 ? noms.length + ' structures : ' + noms[0] + '…' : noms[0],\n                    {direction: 'top', offset: [0, -16]});\n      m.on('click', function(e) { L.DomEvent.stopPropagation(e); ouvrir(k, 0); });\n      couche.addLayer(m);\n      marqueurs[k] = {marker: m, ids: ids};\n    });\n  }\n\n  function deselectionner() {\n    if (courant && marqueurs[courant.k]) {\n      var mq = marqueurs[courant.k];\n      mq.marker.setIcon(icone(mq.ids.length, false));\n    }\n    courant = null;\n    nav.classList.remove('visible');\n  }\n\n  function ouvrir(k, pos) {\n    deselectionner();\n    var mq = marqueurs[k];\n    if (!mq) return;\n    courant = {k: k, pos: pos};\n    mq.marker.setIcon(icone(mq.ids.length, true));\n    afficherFiche();\n  }\n\n  function afficherFiche() {\n    var mq = marqueurs[courant.k], ids = mq.ids, n = ids.length;\n    var h = rechercheActive() ? '<button class=\"lien retour\">' + ico('retour') + 'Retour aux résultats<\/button>' : '';\n    corps.innerHTML = h + ficheHTML(d.fiches[ids[courant.pos]]);\n    animer();\n    corps.scrollTop = 0;\n    var r = corps.querySelector('.retour');\n    if (r) r.addEventListener('click', afficherListe);\n    if (n > 1) {\n      nav.classList.add('visible');\n      compteur.textContent = 'Structure ' + (courant.pos + 1) + ' sur ' + n + ' à cette adresse';\n      btnPrec.disabled = courant.pos === 0;\n      btnSuiv.disabled = courant.pos === n - 1;\n    } else {\n      nav.classList.remove('visible');\n    }\n  }\n\n  function allerVers(id) {\n    var k = lieuDeFiche[id], mq = marqueurs[k];\n    if (!mq) return;\n    var pos = mq.ids.indexOf(id);\n    if (couche.zoomToShowLayer) {\n      couche.zoomToShowLayer(mq.marker, function() { ouvrir(k, pos); });\n    } else {\n      map.setView(mq.marker.getLatLng(), Math.max(map.getZoom(), 11));\n      ouvrir(k, pos);\n    }\n  }\n\n  // --- Liste des résultats (recherche et/ou filtres actifs) ---\n  var jeton = 0;\n  function afficherListe() {\n    deselectionner();\n    var res = d.fiches.filter(correspond);\n    var h = '<h2 class=\"titre-liste\">' + (res.length ? res.length + ' structure' + (res.length > 1 ? 's' : '') : 'Aucune structure') + '<\/h2>';\n    h += '<div class=\"communes\"><\/div>';\n    if (res.length) {\n      h += '<ul class=\"resultats\">';\n      res.forEach(function(f) {\n        h += '<li><button data-id=\"' + f.id + '\"><span class=\"r-nom\">' + esc(f.nom) + '<\/span>' +\n             '<span class=\"r-adr\">' + esc(f.adresse) + '<\/span><\/button><\/li>';\n      });\n      h += '<\/ul>';\n    } else {\n      h += '<p>Aucune structure ne correspond à votre recherche. Essayez d\\'autres mots ou retirez des filtres.<\/p>';\n    }\n    corps.innerHTML = h;\n    animer();\n    corps.scrollTop = 0;\n    corps.querySelectorAll('.resultats button').forEach(function(b) {\n      b.addEventListener('click', function() { allerVers(+b.getAttribute('data-id')); });\n    });\n    chercherCommunes();\n  }\n\n  // Communes trouvées par le service de géocodage de l'IGN (si connexion internet)\n  function chercherCommunes() {\n    var texte = champ.value.trim();\n    var zone = corps.querySelector('.communes');\n    if (!d.recherche_communes || !zone || texte.length < 3 || !window.fetch) return;\n    var mon = ++jeton;\n    fetch('https://data.geopf.fr/geocodage/search?index=address&type=municipality&limit=3&q=' + encodeURIComponent(texte))\n      .then(function(r) { return r.json(); })\n      .then(function(js) {\n        if (mon !== jeton || !js.features || !js.features.length) return;\n        var h = '<div class=\"c-titre\">Centrer la carte sur une commune<\/div>';\n        js.features.forEach(function(ft, i) {\n          var p = ft.properties || {};\n          h += '<button class=\"c-btn\" data-i=\"' + i + '\">' + ico('commune') + '<span>' + esc(p.city || p.label) +\n               (p.postcode ? ' <small>(' + esc(p.postcode) + ')<\/small>' : '') + '<\/span><\/button>';\n        });\n        zone.innerHTML = h;\n        zone.querySelectorAll('.c-btn').forEach(function(b) {\n          b.addEventListener('click', function() {\n            var c = js.features[+b.getAttribute('data-i')].geometry.coordinates;\n            map.setView([c[1], c[0]], 12);\n          });\n        });\n      })\n      .catch(function() {});\n  }\n\n  function afficherAccueil() {\n    deselectionner();\n    corps.innerHTML = accueilHTML;\n    animer();\n    corps.scrollTop = 0;\n  }\n  function vueParDefaut() { if (rechercheActive()) afficherListe(); else afficherAccueil(); }\n\n  function majResume() {\n    var n = d.fiches.filter(correspond).length;\n    resume.hidden = !rechercheActive();\n    nbRes.textContent = n + ' structure' + (n > 1 ? 's' : '') + ' sur ' + d.fiches.length;\n    var nf = Object.keys(actifs).length;\n    badge.hidden = nf === 0;\n    badge.textContent = nf;\n  }\n  function appliquer() { construire(); majResume(); vueParDefaut(); }\n\n  // --- Événements ---\n  var minuterie = null;\n  champ.addEventListener('input', function() {\n    effacer.hidden = !champ.value;\n    clearTimeout(minuterie);\n    minuterie = setTimeout(function() {\n      mots = norm(champ.value).split(/\\s+/).filter(function(w) { return w.length > 0; });\n      appliquer();\n    }, 250);\n  });\n  champ.addEventListener('keydown', function(e) {\n    if (e.key === 'Enter') {   // Entrée : ouvre directement le premier résultat\n      var res = d.fiches.filter(correspond);\n      if (res.length === 1) allerVers(res[0].id);\n    }\n  });\n  effacer.addEventListener('click', function() {\n    champ.value = ''; effacer.hidden = true; mots = []; appliquer(); champ.focus();\n  });\n  btnFiltres.addEventListener('click', function() {\n    var ouvert = btnFiltres.getAttribute('aria-expanded') === 'true';\n    btnFiltres.setAttribute('aria-expanded', ouvert ? 'false' : 'true');\n    zoneFiltres.hidden = ouvert;\n  });\n  zoneFiltres.querySelectorAll('.tag').forEach(function(b) {\n    b.addEventListener('click', function() {\n      var s = b.getAttribute('data-s');\n      if (actifs[s]) { delete actifs[s]; b.setAttribute('aria-pressed', 'false'); }\n      else { actifs[s] = true; b.setAttribute('aria-pressed', 'true'); }\n      appliquer();\n    });\n  });\n  q('.reinit').addEventListener('click', function() {\n    actifs = {}; mots = []; champ.value = ''; effacer.hidden = true;\n    zoneFiltres.querySelectorAll('.tag').forEach(function(b) { b.setAttribute('aria-pressed', 'false'); });\n    appliquer();\n  });\n  btnPrec.addEventListener('click', function() { if (courant && courant.pos > 0) { courant.pos--; afficherFiche(); } });\n  btnSuiv.addEventListener('click', function() {\n    if (courant && courant.pos < marqueurs[courant.k].ids.length - 1) { courant.pos++; afficherFiche(); }\n  });\n  q('.accueil').addEventListener('click', afficherAccueil);\n  map.on('click', vueParDefaut);\n\n  // --- Vue de départ : la région entière, en tenant compte du panneau ---\n  var b = L.latLngBounds([d.bbox[1], d.bbox[0]], [d.bbox[3], d.bbox[2]]);\n  function cadrer() {\n    map.fitBounds(b, {paddingTopLeft: [20, 20], paddingBottomRight: [volet.offsetWidth + 44, 20]});\n  }\n  construire();\n  majResume();\n  cadrer();\n  map.whenReady(cadrer);\n  afficherAccueil();\n}\n).call(this.getMap(), el, x, data);\n}","data":{"titre":"Structures d'accompagnement haies","service":"SRISE de Lille","bloc":["DRAAF","Hauts-de-France"],"accueil":"\n<h2>Bienvenue sur la carte des structures accompagnant les projets de haies en région Hauts-de-France<\/h2>\n<p>Cette carte recense les structures qui accompagnent les agriculteurs dans leurs projets de haies :\nplantation, gestion, valorisation du bois bocager et accompagnement administratif.<\/p>\n<div class='mode-emploi'>\n<h4>Comment l'utiliser ?<\/h4>\n<div class='item'><span class='emo'>🔍<\/span> Recherchez une structure ou une commune avec la barre de recherche ci-dessus.<\/div>\n<div class='item'><span class='emo'>🏷️<\/span> Filtrez les structures selon les services qui vous intéressent (plantation, PGDH, MAEC…).<\/div>\n<div class='item'><span class='emo'>📍<\/span> Cliquez sur un point pour afficher la fiche de la structure.<\/div>\n<div class='item'><span class='emo'>🔢<\/span> Un cercle numéroté regroupe des structures proches : cliquez dessus pour zoomer.<\/div>\n<div class='item'><span class='emo'>🏠<\/span> Pour revenir à cette page, cliquez dans une zone vide de la carte.<\/div>\n<h4>Plusieurs structures au même endroit ?<\/h4>\n<p>Certaines structures partagent la même adresse : leur point affiche alors un nombre.\nLeurs fiches s'affichent les unes après les autres dans ce panneau : utilisez les\n<b>petites flèches ◀ ▶<\/b> en haut du panneau pour passer d'une fiche à l'autre.\nLe compteur (par exemple 1 sur 3) indique le nombre de fiches disponibles.<\/p>\n<h4>Dans chaque fiche, vous trouverez :<\/h4>\n<div class='item'><span class='emo'>👤<\/span> les coordonnées de la personne à contacter ;<\/div>\n<div class='item'><span class='emo'>🗺️<\/span> le territoire d'intervention de la structure ;<\/div>\n<div class='item'><span class='emo'>✅<\/span> les services proposés : plantation, gestion, valorisation, accompagnement.<\/div>\n<\/div>\n<div class='encart'><b>Vous avez un projet de haie ?<\/b><br>Pour le dessouchage d'arbres, contactez directement Claire.<\/div>\n<p class='source'>Source : DRAAF Hauts-de-France – données mises à jour en octobre 2026.<\/p>\n","icones":{"pin":"M12 23.7279L5.63604 17.364C2.12132 13.8492 2.12132 8.15076 5.63604 4.63604C9.15076 1.12132 14.8492 1.12132 18.364 4.63604C21.8787 8.15076 21.8787 13.8492 18.364 17.364L12 23.7279ZM16.9497 15.9497C19.6834 13.2161 19.6834 8.78392 16.9497 6.05025C14.2161 3.31658 9.78392 3.31658 7.05025 6.05025C4.31658 8.78392 4.31658 13.2161 7.05025 15.9497L12 20.8995L16.9497 15.9497ZM12 13C10.8954 13 10 12.1046 10 11C10 9.89543 10.8954 9 12 9C13.1046 9 14 9.89543 14 11C14 12.1046 13.1046 13 12 13Z","territoire":"M4 6.14286V18.9669L9.06476 16.7963L15.0648 19.7963L20 17.6812V4.85714L21.303 4.2987C21.5569 4.18992 21.8508 4.30749 21.9596 4.56131C21.9862 4.62355 22 4.69056 22 4.75827V19L15 22L9 19L2.69696 21.7013C2.44314 21.8101 2.14921 21.6925 2.04043 21.4387C2.01375 21.3765 2 21.3094 2 21.2417V7L4 6.14286ZM16.2426 11.2426L12 15.4853L7.75736 11.2426C5.41421 8.89949 5.41421 5.10051 7.75736 2.75736C10.1005 0.414214 13.8995 0.414214 16.2426 2.75736C18.5858 5.10051 18.5858 8.89949 16.2426 11.2426ZM12 12.6569L14.8284 9.82843C16.3905 8.26633 16.3905 5.73367 14.8284 4.17157C13.2663 2.60948 10.7337 2.60948 9.17157 4.17157C7.60948 5.73367 7.60948 8.26
